[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signatureanalyzer"
version = "0.0.9"
description = "Bayesian NMF methods for mutational signature analysis & transcriptomic profiling on GPUs (Getz Lab)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Shankara Anand & Justin Cha - Broad Institute - Cancer Genome Computational Analysis", email = "sanand@broadinstitute.org"}
]
license = {text = "MIT"}
dependencies = [
  "gprofiler>=0.1.0",
  "h5py>=3.10.0",
  "matplotlib>=3.8.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "scikit-image>=0.24.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.13.0",
  "seaborn>=0.13.0",
  "tables>=3.6.1",
  "torch>=2.3.0",
  "tqdm>=4.33.0",
  "twobitreader>=3.1.7"
]

[project.scripts]
signatureanalyzer = "signatureanalyzer.__main__:main"

[tool.setuptools]
include-package-data = true
